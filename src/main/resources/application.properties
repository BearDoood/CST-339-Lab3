spring.application.name=lab1-api

# Render passes in PORT, locally it falls back to 8080
server.port=${PORT:8080}

# JPA and Postgres are on the classpath for later labs but there's no database yet,
# so skip the datasource setup for now
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration

logging.level.com.gcu=INFO

springdoc.swagger-ui.path=/swagger-ui.html
